<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="icon" type="logo.png" href="static/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
 <nav class="navbar navbar-inverse">
  <div class="container-fluid">
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
    <a href="{{ url_for('register') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Register</a>
    <a href="{{ url_for('login') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Login</a>
    <a href="{{ url_for('aboutus') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">About Us</a>
    <div class="navbar-header">
      <a class="navbar-brand" href="#">PCEA Gatiiguru Church</a>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
    </div>
  </div>
</nav>
</body>
</html>
